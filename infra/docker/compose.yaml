# Local demo only. The default password is a dummy value for a database that is not published.
name: paygate-sandbox

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paygate
      POSTGRES_USER: paygate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paygate_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygate -d paygate"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../../apps/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/paygate
      DB_USERNAME: paygate
      DB_PASSWORD: ${DB_PASSWORD:-paygate_local_only}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
