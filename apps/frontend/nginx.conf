server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # shortcut: the backend rate limit sees this proxy as one address; forward the client
        # address and make the backend trust it before anyone relies on per-client limits.
        client_max_body_size 3m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # The app has its own routes, such as /checkout/{id}.
    location / {
        try_files $uri /index.html;
    }
}
