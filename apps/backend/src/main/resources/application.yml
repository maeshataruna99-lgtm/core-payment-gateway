spring:
  application:
    name: payment-gateway
  autoconfigure:
    # API keys are the only login, so Spring's generated default user must not exist.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paygate}
    username: ${DB_USERNAME:paygate}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  task:
    scheduling:
      pool:
        # So slow webhook sends do not delay the payment sweeper.
        size: 3
  jackson:
    deserialization:
      # Rejects extra fields, such as a client-supplied payment status.
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs

payment:
  checkout:
    # Has no default: the application refuses to start without a secret.
    token-secret: ${CHECKOUT_TOKEN_SECRET:}
    base-url: ${CHECKOUT_BASE_URL:http://localhost:5173}
    # A simulated limit, not a regulatory value.
    max-amount: 100000000
    default-ttl: 1h
    max-ttl: 7d
  rate-limit:
    requests-per-minute: 600
  fee:
    # A simulated fee of 0.7%, not a regulatory value.
    basis-points: 70
  sweeper:
    cron: "*/15 * * * * *"
  webhook:
    # Has no default: the application refuses to start without a key.
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:}
    base-delay: 30s
    max-automatic-attempts: 5
    max-total-attempts: 10
    allowed-hosts: []
    publish-cron: "*/2 * * * * *"
    deliver-cron: "*/2 * * * * *"
