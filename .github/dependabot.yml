version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: weekly
    # The project stays on Java 21 LTS until a decision changes it. Tags encode the JDK version,
    # so Dependabot sees a newer JDK as an ordinary update.
    ignore:
      - dependency-name: eclipse-temurin
      - dependency-name: maven
